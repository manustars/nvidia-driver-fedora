# Prometheus for GPU / LLM metrics (Grafana datasource "Prometheus").
# Server only; scrapes the cluster defaults (nodes, cAdvisor, annotated
# services) plus the GPU exporters below. Runs on the control plane.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.37.0
    helm:
      values: |
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        kube-state-metrics:
          enabled: false
        configmapReload:
          prometheus:
            enabled: true
        server:
          retention: 30d
          retentionSize: 9GB
          global:
            scrape_interval: 15s
            evaluation_interval: 30s
          persistentVolume:
            enabled: true
            size: 10Gi
            # Binds on the node where the pod lands (see the "llm" app)
            storageClass: topolvm-local
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
        extraScrapeConfigs: |
          # dcgm-exporter is scraped by the default kubernetes-service-endpoints
          # job (its Service has prometheus.io/scrape annotations)
          # llama-swap host and GPU metrics (does not load the model)
          - job_name: llama-swap
            metrics_path: /metrics
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [llm]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                regex: llama-swap
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
