name: Build driver image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      driver_version:
        description: NVIDIA driver version
        default: "595.91.07"
      fedora_version:
        description: Fedora release of the nodes
        default: "43"
      kernel_version:
        description: Node kernel (uname -r) used for the module build test
        default: "7.0.12-101.fc43.x86_64"

env:
  DRIVER_VERSION: ${{ inputs.driver_version || '595.91.07' }}
  FEDORA_VERSION: ${{ inputs.fedora_version || '43' }}
  TEST_KERNEL_VERSION: ${{ inputs.kernel_version || '7.0.12-101.fc43.x86_64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # The GPU Operator appends "-<ID><VERSION_ID>" from the node's os-release,
          # so the tag must end in "-fedora<release>".
          tag="${DRIVER_VERSION}-fedora${FEDORA_VERSION}"
          echo "image=ghcr.io/${owner}/driver" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "branch=${DRIVER_VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: driver-test:local
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            DRIVER_VERSION=${{ env.DRIVER_VERSION }}
            DRIVER_BRANCH=${{ steps.meta.outputs.branch }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the same code path used on a node after a kernel update: unpack the
      # driver, fetch the kernel RPMs (repos or Koji) and compile the open modules.
      - name: Test module build against the node kernel
        run: |
          docker run --rm --privileged \
            -e KERNEL_MODULE_TYPE=open \
            --entrypoint bash driver-test:local -c '
              set -e
              mkdir -p /run/nvidia /run/kernel/postinst.d
              touch /run/nvidia/nvidia-driver.pid
              nvidia-driver update --kernel "$0"
              ls -l /usr/src/nvidia-*/kernel-open/precompiled/
            ' "${TEST_KERNEL_VERSION}"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            DRIVER_VERSION=${{ env.DRIVER_VERSION }}
            DRIVER_BRANCH=${{ steps.meta.outputs.branch }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.created }}
          cache-from: type=gha
